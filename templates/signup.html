<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Straightline Vault – Create Account</title>
</head>
<body>
  <h1>Create account</h1>

  {% if error %}<p style="color:#b00">{{ error }}</p>{% endif %}
  {% if ok %}<p style="color:#090">{{ ok }}</p>{% endif %}

  <form method="post" action="{{ url_for('signup') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <label>Invite code <input name="invite" required></label><br><br>
    <label>Username <input name="username" autocomplete="username" required></label><br><br>
    <label>Password <input name="password" type="password" autocomplete="new-password" required></label><br><br>
    <button type="submit">Create account</button>
  </form>

  <p><a href="{{ url_for('login') }}">Back to login</a></p>
</body>
</html>
